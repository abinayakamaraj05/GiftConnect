<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | GiftConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-navbar">
        <div class="app-nav-container">
            <a href="dashboard.html" class="logo">Gift<span>Connect</span></a>
            <ul class="app-nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="orders.html" class="active">Orders</a></li>
            </ul>
            <div class="app-nav-user">
                <span id="currentUserEmail">…</span>
                <button class="btn-small delete" id="navLogoutBtn">Logout</button>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="page-header">
            <h1>Orders</h1>
            <button class="btn-primary" id="openNewOrderBtn" style="border:none; cursor:pointer;">
                + New Order
            </button>
        </div>

        <div class="toolbar">
            <button class="btn-small edit" id="viewMyOrdersBtn">My Orders</button>
            <button class="btn-small" id="viewAllOrdersBtn">View All Orders</button>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Payment</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
        </table>
        <div class="empty-state" id="orderEmptyState" style="display:none;">
            No orders found.
        </div>
    </main>

    <!-- New Order Modal -->
    <div class="modal-overlay" id="newOrderModal">
        <div class="modal-box">
            <h2>New Order</h2>
            <form id="newOrderForm">
                <textarea id="shippingAddress" placeholder="Shipping address" rows="2"></textarea>

                <div id="orderItemsList"></div>
                <button type="button" class="btn-small edit" id="addItemRowBtn">+ Add Item</button>

                <p style="font-weight:600; margin-top:0.5rem;">
                    Estimated total: ₹<span id="estimatedTotal">0.00</span>
                </p>

                <p class="form-message" id="newOrderMessage"></p>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelNewOrderBtn">Cancel</button>
                    <button type="submit" class="btn-primary" style="border:none; cursor:pointer;">Place Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-overlay" id="orderDetailModal">
        <div class="modal-box" style="max-width:600px;">
            <h2>Order Details</h2>
            <div id="orderDetailContent"></div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="closeOrderDetailBtn">Close</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 GiftConnect. Built as a college capstone project.</p>
    </footer>

    <script src="js/auth-guard.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
