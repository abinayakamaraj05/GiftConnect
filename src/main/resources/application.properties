# ===== Application =====
spring.application.name=GiftConnect
server.port=8080

# ===== Static assets: always revalidate =====
# Sends "Cache-Control: no-cache" so the browser revalidates HTML/JS/CSS on every
# load. This prevents a stale verify.html / verify.js from being served out of the
# browser cache after a rebuild.
spring.web.resources.cache.cachecontrol.no-cache=true
# Reproducible-jar builds stamp every resource with a fixed 1980 timestamp, so
# "Last-Modified" never changes and a revalidating browser would always receive
# 304 Not Modified and keep its stale copy. Disable last-modified for static
# resources so revalidation returns the current file (no ETag is configured).
spring.web.resources.cache.use-last-modified=false

# ===== MySQL Database Connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/loved_ones_gifting?createDatabaseIfNotExist=false&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Password is read from the DB_PASSWORD environment variable — never hardcode it here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" only adds missing tables/columns — it will NOT drop or recreate existing ones.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Local secrets (optional .env file in project root — git-ignored) =====
# Lets you keep MAIL_USERNAME / MAIL_PASSWORD / DB_PASSWORD out of the shell.
spring.config.import=optional:file:.env[.properties]

# ===== Email / SMTP (Phase 1 — OTP verification) =====
# Credentials come ONLY from environment variables (or the git-ignored .env).
# Gmail: host smtp.gmail.com, port 587, MAIL_PASSWORD = 16-char App Password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender identity on the OTP email.
app.mail.from=${MAIL_FROM:no-reply@giftconnect.local}

# ===== Session cookie hardening =====
# SameSite=Lax: cookie is sent on same-site navigations and top-level GETs only,
# which blocks the practical CSRF vector for this JSON API while keeping login
# redirects working. HttpOnly + no explicit secure flag (local dev over http).
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# 30 minutes of inactivity before a session expires.
server.servlet.session.timeout=30m
