# ===== Application =====
spring.application.name=GiftConnect
server.port=8080

# ===== MySQL Database Connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/loved_ones_gifting?createDatabaseIfNotExist=false&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Password is read from the DB_PASSWORD environment variable — never hardcode it here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" only adds missing tables/columns — it will NOT drop or recreate existing ones.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
